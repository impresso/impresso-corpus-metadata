[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impresso_corpus_metadata"
authors = [
    {name="Pauline Conti", email="pauline.conti@epfl.ch"}
]
description = "Library to harvest metadata and access rights information about the Impresso corpus."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]

dependencies = [
    "beautifulsoup4",
    "docopt",
    "fire",
    "black",
    "gspread",
    "pymarc"
]

[project.urls]
Homepage = "https://github.com/impresso/impresso-corpus-metadata"

[tool.setuptools.dynamic]
version = {attr = "harvesters.__version__"}

[tool.setuptools.packages.find]
include = ["harvesters*"]
namespaces = false
